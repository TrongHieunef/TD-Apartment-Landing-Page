<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD APARTMENTS - Luxury Living</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#C5A059', dark: '#1A1515', light: '#FDFCFB', graybg: '#F5F3F0' },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style type="text/css">
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { background: rgba(0, 0, 0, 0.75); backdrop-blur: 8px; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-light text-dark font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [filter, setFilter] = useState('All');
            const [selectedApt, setSelectedApt] = useState(null);
            const [activeImgIndex, setActiveImgIndex] = useState(0);
            
            // Phần API Logic mới
            const [apartments, setApartments] = useState([]);
            const [loading, setLoading] = useState(true);

           useEffect(() => {
                const onScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', onScroll);

                // --- KẾT NỐI SANITY CHO PROJECT 11n523x3 ---
                const projectId = '11n523x3'; 
                const dataset = 'production';
                
                // Câu lệnh GROQ lấy dữ liệu căn hộ
                // Lưu ý: "images[0].asset->url" sẽ lấy link của tấm ảnh đầu tiên trong mảng ảnh
                const query = encodeURIComponent(`*[_type == "apartment"]{
                    "id": _id,
                    "name": name,
                    "type": type,
                    "size": size,
                    "price": price,
                    "desc": desc,
                    "images": images[].asset->url,
                    "amenities": amenities
                }`);

                const API_URL = `https://${projectId}.api.sanity.io/v2021-10-21/data/query/${dataset}?query=${query}`;

                fetch(API_URL)
                    .then(res => res.json())
                    .then(data => {
                        // Sanity trả kết quả về trong mảng result
                        if (data.result) {
                            setApartments(data.result);
                        }
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Lỗi kết nối Sanity:", err);
                        setLoading(false);
                    });
                // --- KẾT THÚC KẾT NỐI ---

                return () => window.removeEventListener('scroll', onScroll);
            }, []);
            const filteredApts = filter === 'All' ? apartments : apartments.filter(a => a.type === filter);

            const openModal = (apt) => {
                setSelectedApt(apt);
                setActiveImgIndex(0);
            };

            if (loading) {
                return <div className="h-screen flex items-center justify-center font-serif text-gold">Đang tải dữ liệu...</div>;
            }

            return (
                <div className="relative">
                    {/* NAVIGATION */}
                    <nav className={`fixed top-0 w-full z-[100] transition-all px-6 py-4 ${scrolled ? 'bg-white shadow-sm' : 'bg-transparent'}`}>
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <span className="text-3xl font-serif font-bold text-gold tracking-tight">TD APARTMENT</span>
                            <div className="hidden md:flex gap-10 text-xs font-bold uppercase tracking-widest text-dark">
                                <a href="#about" className="hover:text-gold transition-colors">Giới thiệu</a>
                                <a href="#why-us" className="hover:text-gold transition-colors">Đặc quyền</a>
                                <a href="#rooms" className="hover:text-gold transition-colors">Căn hộ</a>
                            </div>
                            <a href="https://zalo.me" className="bg-dark text-white px-7 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-gold transition-colors shadow-lg">
                            Tư Vấn
                            </a>
                        </div>
                    </nav>

                    {/* HERO */}
                    <header className="h-[80vh] relative flex items-center justify-center">
                        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=1920" className="absolute inset-0 w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-dark/40" />
                        <div className="absolute inset-0 bg-gradient-to-t from-light via-transparent to-transparent" />
                        <div className="relative text-center text-white px-4 z-10">
                            <span className="uppercase tracking-[0.3em] text-xs font-bold mb-4 block text-gold">Exclusive Living</span>
                            <h1 className="text-5xl md:text-7xl font-serif mb-6 leading-tight">Nâng Tầm <br/> Phong Cách Sống</h1>
                            <button onClick={() => document.getElementById('rooms').scrollIntoView()} className="mt-8 bg-gold text-white px-10 py-4 rounded-xl font-bold uppercase tracking-widest hover:scale-105 transition-transform shadow-xl">
                                Khám phá không gian
                            </button>
                        </div>
                    </header>

                    {/* STATS SECTION */}
                    <section id="about" className="py-12 bg-white border-b border-gray-100">
                        <div className="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8 text-center px-6">
                            <div><p className="text-4xl font-serif text-gold mb-2">5+</p><p className="text-xs uppercase tracking-widest text-gray-400 font-bold">Năm kinh nghiệm</p></div>
                            <div><p className="text-4xl font-serif text-gold mb-2">500+</p><p className="text-xs uppercase tracking-widest text-gray-400 font-bold">Khách thuê</p></div>
                            <div><p className="text-4xl font-serif text-gold mb-2">15+</p><p className="text-xs uppercase tracking-widest text-gray-400 font-bold">Tiện ích nội khu</p></div>
                            <div><p className="text-4xl font-serif text-gold mb-2">99%</p><p className="text-xs uppercase tracking-widest text-gray-400 font-bold">Tỷ lệ hài lòng</p></div>
                        </div>
                    </section>

                    {/* WHY CHOOSE US */}
                    <section id="why-us" className="py-24 bg-graybg px-6">
                        <div className="max-w-7xl mx-auto">
                            <div className="text-center mb-16">
                                <span className="text-gold font-bold text-xs uppercase tracking-widest">Đặc quyền cư dân</span>
                                <h2 className="text-4xl font-serif mt-3 text-dark">Tại sao chọn TD APARTMENT?</h2>
                            </div>
                            <div className="grid md:grid-cols-3 gap-12">
                                <div className="bg-white p-10 rounded-2xl shadow-sm hover:shadow-xl transition-shadow">
                                    <div className="w-14 h-14 bg-gold/10 text-gold rounded-xl flex items-center justify-center mb-6">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    </div>
                                    <h4 className="text-xl font-serif mb-3">Vị trí trung tâm</h4>
                                    <p className="text-sm text-gray-500 leading-relaxed">Chỉ mất 5 phút di chuyển đến các quận trung tâm, thuận tiện kết nối các khu thương mại, nhà hàng và giải trí.</p>
                                </div>
                                <div className="bg-white p-10 rounded-2xl shadow-sm hover:shadow-xl transition-shadow">
                                    <div className="w-14 h-14 bg-gold/10 text-gold rounded-xl flex items-center justify-center mb-6">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                                    </div>
                                    <h4 className="text-xl font-serif mb-3">An ninh tuyệt đối 24/7</h4>
                                    <p className="text-sm text-gray-500 leading-relaxed">Hệ thống camera giám sát, bảo vệ trực 24/7 cùng khóa cửa vân tay thông minh đảm bảo sự riêng tư và an toàn.</p>
                                </div>
                                <div className="bg-white p-10 rounded-2xl shadow-sm hover:shadow-xl transition-shadow">
                                    <div className="w-14 h-14 bg-gold/10 text-gold rounded-xl flex items-center justify-center mb-6">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                                    </div>
                                    <h4 className="text-xl font-serif mb-3">Dịch vụ chuẩn 5 sao</h4>
                                    <p className="text-sm text-gray-500 leading-relaxed">Miễn phí dọn phòng, thay ga giường định kỳ. Đội ngũ lễ tân và kỹ thuật luôn sẵn sàng hỗ trợ bạn bất cứ lúc nào.</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* FILTER SECTION (Sticky) */}
                    <section id="rooms" className="sticky top-[72px] z-[90] bg-white/95 backdrop-blur border-y border-gray-100 py-5 px-6 shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center gap-6 overflow-x-auto no-scrollbar">
                            <span className="font-serif font-bold text-dark whitespace-nowrap hidden md:block">Lọc phòng:</span>
                            {['All', 'Studio', '1PN', '2PN'].map(f => (
                                <button 
                                    key={f}
                                    onClick={() => setFilter(f)}
                                    className={`px-6 py-2 rounded-xl text-xs font-bold transition-all border whitespace-nowrap ${filter === f ? 'bg-dark text-white border-dark' : 'bg-white text-gray-500 border-gray-200 hover:border-gold hover:text-gold'}`}
                                >
                                    {f === 'All' ? 'Tất cả căn hộ' : `Căn hộ ${f}`}
                                </button>
                            ))}
                        </div>
                    </section>

                    {/* APARTMENT LISTING */}
                    <section className="py-20 px-6 max-w-7xl mx-auto">
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
                            {filteredApts.map((apt, index) => (
                                <div key={apt.id || index} className="group bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-2xl transition-all border border-gray-100 flex flex-col">
                                    <div className="relative h-72 overflow-hidden cursor-pointer" onClick={() => openModal(apt)}>
                                        <img src={apt.images && apt.images[0]} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                        <div className="absolute top-4 left-4 bg-white/90 backdrop-blur px-4 py-1.5 rounded-lg text-[10px] font-bold tracking-widest uppercase text-dark shadow-sm">{apt.type}</div>
                                        <div className="absolute inset-0 bg-dark/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                            <span className="bg-gold text-white px-6 py-2 rounded-lg text-xs font-bold">Xem chi tiết</span>
                                        </div>
                                    </div>
                                    <div className="p-7 flex flex-col flex-grow">
                                        <h3 className="text-xl font-serif mb-2 text-dark">{apt.name}</h3>
                                        <p className="text-xs text-gray-400 uppercase tracking-widest mb-6">{apt.size} • Full Nội thất</p>
                                        <div className="mt-auto flex justify-between items-center pt-5 border-t border-gray-100">
                                            <span className="text-gold font-bold text-xl">{apt.price}</span>
                                            <a href="https://zalo.me" className="bg-gold text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-gold-700 transition-colors">Zalo ngay</a>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* TESTIMONIALS */}
                    <section className="py-24 bg-dark text-white px-6">
                        <div className="max-w-7xl mx-auto">
                            <div className="text-center mb-16">
                                <h2 className="text-4xl font-serif text-gold">Khách Hàng Nói Gì Về Chúng Tôi</h2>
                                <p className="text-gray-400 mt-4 text-sm max-w-2xl mx-auto">Hàng trăm chuyên gia, người nước ngoài và doanh nhân đã lựa chọn Luxia làm nơi an cư lạc nghiệp.</p>
                            </div>
                            <div className="grid md:grid-cols-3 gap-8">
                                {[
                                    { name: "Anh Hoàng Nam", role: "CEO Tech Startup", review: "Tôi thuê căn 1PN tại đây đã hơn 1 năm. Rất hài lòng về sự yên tĩnh, dịch vụ dọn phòng sạch sẽ. Đặc biệt bảo vệ cực kỳ thân thiện và chuyên nghiệp." },
                                    { name: "Chị Thu Thủy", role: "Chuyên gia tài chính", review: "Nội thất thực tế đẹp hơn trong ảnh rất nhiều. Đồ điện gia dụng toàn hàng cao cấp. Tôi thích nhất là khu vực bếp rất rộng và ban công thoáng." },
                                    { name: "Mr. David Lee", role: "Expat from Singapore", review: "Excellent location and top-notch security. The management team is very responsive on Zalo. Highly recommend for any expats moving to the city." }
                                ].map((t, i) => (
                                    <div key={i} className="bg-white/5 p-8 rounded-2xl border border-white/10 relative">
                                        <div className="text-gold mb-4 flex gap-1">
                                            {[1,2,3,4,5].map(star => <svg key={star} className="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>)}
                                        </div>
                                        <p className="text-gray-300 text-sm leading-relaxed mb-6 italic">"{t.review}"</p>
                                        <div>
                                            <h5 className="font-bold text-sm text-white">{t.name}</h5>
                                            <p className="text-xs text-gold mt-1">{t.role}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="bg-[#110D0D] text-white pt-20 pb-10 px-6">
                        <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-12 border-b border-white/10 pb-16">
                            <div className="md:col-span-1">
                                <h2 className="text-3xl font-serif text-gold mb-6">TD.</h2>
                                <p className="text-sm text-gray-400 leading-relaxed mb-6">Thương hiệu quản lý và vận hành căn hộ dịch vụ cao cấp hàng đầu. Tận tâm trong từng chi tiết nhỏ nhất.</p>
                                <a href="https://zalo.me" className="inline-flex items-center gap-2 bg-[#0068FF] px-6 py-3 rounded-xl text-xs font-bold transition hover:bg-blue-600">
                                    Chat Zalo Ngay
                                </a>
                            </div>
                            <div>
                                <h5 className="font-bold text-xs uppercase mb-6 tracking-widest text-gold">Khám phá</h5>
                                <ul className="space-y-4 text-sm text-gray-400">
                                    <li><a href="#" className="hover:text-white transition">Tất cả căn hộ</a></li>
                                    <li><a href="#" className="hover:text-white transition">Quy định thuê</a></li>
                                    <li><a href="#" className="hover:text-white transition">Tiện ích nội khu</a></li>
                                    <li><a href="#" className="hover:text-white transition">Hỏi đáp (FAQ)</a></li>
                                </ul>
                            </div>
                            <div>
                                <h5 className="font-bold text-xs uppercase mb-6 tracking-widest text-gold">Liên hệ</h5>
                                <ul className="space-y-4 text-sm text-gray-400">
                                    <li>📍 Tòa nhà TD APARTMENT, Quận Hải Châu, TP.Đà Nẵng</li>
                                    <li>📞 090 xxx xxx</li>
                                    <li>✉️ tdapartmentbooking@gmail.vn</li>
                                </ul>
                            </div>
                            <div>
                                <h5 className="font-bold text-xs uppercase mb-6 tracking-widest text-gold">Kết nối mạng xã hội</h5>
                                <div className="flex gap-4">
                                    <a href="#" className="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center hover:bg-[#1877F2] transition"><span className="text-xs font-bold">FB</span></a>
                                    <a href="#" className="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center hover:bg-gradient-to-tr from-yellow-400 to-purple-600 transition"><span className="text-xs font-bold">IG</span></a>
                                </div>
                            </div>
                        </div>
                        <div className="text-center mt-10">
                            <p className="text-xs text-gray-600 uppercase tracking-widest">© 2026 TD Apartments. All rights reserved.</p>
                        </div>
                    </footer>

                    {/* POPUP CHI TIẾT CĂN HỘ */}
                    {selectedApt && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 md:p-8">
                            <div className="absolute inset-0 modal-overlay cursor-pointer" onClick={() => setSelectedApt(null)}></div>
                            <div className="bg-white w-full max-w-5xl max-h-[95vh] overflow-y-auto rounded-2xl relative z-10 animate-fade-in flex flex-col md:flex-row shadow-2xl">
                                <button onClick={() => setSelectedApt(null)} className="absolute top-4 right-4 z-20 w-10 h-10 bg-black/50 hover:bg-black text-white rounded-full flex items-center justify-center transition backdrop-blur">✕</button>
                                
                                <div className="w-full md:w-1/2 p-4 md:p-6 bg-gray-50">
                                    <div className="w-full h-[300px] md:h-[450px] rounded-xl overflow-hidden mb-4 shadow-sm border border-gray-200">
                                        <img src={selectedApt.images && selectedApt.images[activeImgIndex]} className="w-full h-full object-cover transition-opacity duration-300" />
                                    </div>
                                    <div className="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                                        {selectedApt.images && selectedApt.images.map((img, idx) => (
                                            <div 
                                                key={idx} 
                                                onClick={() => setActiveImgIndex(idx)}
                                                className={`w-20 h-20 md:w-24 md:h-24 flex-shrink-0 rounded-xl overflow-hidden cursor-pointer border-2 transition-all ${activeImgIndex === idx ? 'border-gold opacity-100' : 'border-transparent opacity-50 hover:opacity-100'}`}
                                            >
                                                <img src={img} className="w-full h-full object-cover" />
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="w-full md:w-1/2 p-6 md:p-10 flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <span className="text-gold font-bold text-xs uppercase tracking-widest bg-gold/10 px-3 py-1 rounded-md">{selectedApt.type}</span>
                                                <h2 className="text-3xl font-serif mt-3 text-dark">{selectedApt.name}</h2>
                                            </div>
                                        </div>
                                        <div className="flex gap-4 text-xs font-bold text-gray-500 uppercase tracking-widest mb-6 pb-6 border-b border-gray-100">
                                            <span>DIỆN TÍCH: <span className="text-dark">{selectedApt.size}</span></span>
                                        </div>
                                        <p className="text-gray-600 text-sm leading-relaxed mb-8">{selectedApt.desc}</p>
                                        <h4 className="font-bold text-sm text-dark uppercase mb-4">Tiện ích đi kèm</h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-y-3 gap-x-4 mb-8">
                                            {selectedApt.amenities && selectedApt.amenities.map(a => (
                                                <div key={a} className="flex items-center gap-2 text-sm text-gray-600">
                                                    <div className="w-5 h-5 rounded-full bg-gold/20 flex items-center justify-center text-gold text-xs">✓</div> 
                                                    {a}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-graybg p-6 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 mt-auto">
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase font-bold mb-1">Giá thuê từ</p>
                                            <p className="text-3xl font-bold text-gold">{selectedApt.price}<span className="text-sm font-normal text-gray-500"> /tháng</span></p>
                                        </div>
                                        <a href="https://zalo.me" className="w-full sm:w-auto text-center bg-gold text-white px-8 py-4 rounded-xl font-bold text-sm shadow-lg hover:bg-gold-700 transition-colors">
                                            Chat Zalo Đặt Phòng
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NÚT ZALO GÓC MÀN HÌNH */}
                    <div className="fixed bottom-6 right-6 z-[90]">
                        <a href="https://zalo.me" className="w-14 h-14 bg-[#0068FF] rounded-2xl flex items-center justify-center text-white shadow-2xl hover:scale-110 transition-transform relative group">
                            <span className="font-bold text-xs">ZALO</span>
                            <span className="absolute right-16 bg-dark text-white text-xs px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition whitespace-nowrap">Cần hỗ trợ?</span>
                        </a>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
